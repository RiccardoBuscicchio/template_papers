name: paper
on:
  push:
    branches: [ "epjc" ]
  pull_request:
    branches: [ "epjc" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: .
      FILE: main
    steps:
      - uses: actions/checkout@v4
      - name: Install TeXlive
        run: sudo apt-get update && sudo apt-get install -y texlive texlive-publishers texlive-science latexmk cm-super
      - name: LaTeX compile
        working-directory: ${{ env.DIR }}
        run: pdflatex ${{ env.FILE }}; bibtex ${{ env.FILE }}; pdflatex ${{ env.FILE }}; pdflatex ${{ env.FILE }};
      - name: Zip arXiv submission
        run: zip -r ${{ env.FILE }}.zip ${{ env.FILE }}.bbl ${{ env.FILE }}.bib ${{ env.FILE }}.tex aasmacros.sty epjc.bst svepj.clo svjour.cls widetext.sty #_Figure*.pdf #appendix.tex
      - name: Move paper pdf and submission zip to artifacts
        run: mkdir -p artifacts && mv -f ${{ env.FILE }}.pdf ${{ env.FILE }}.zip artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifacts/
# Deploy the pdf and zip to two orphan branches. build_pdf, build_arxiv
  deploy_pdf:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      DIR: .
      FILE: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: artifacts/
      - name: Move pdf
        run: mkdir -p github_deploy && mv -f artifacts/${{ env.FILE }}.pdf github_deploy
      - name: Deploy pdf on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: epjc_build
          force_orphan: true

  deploy_arxiv:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      DIR: .
      FILE: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: artifacts/
      - name: Move zip
        run: mkdir -p github_deploy && mv -f artifacts/${{ env.FILE }}.zip github_deploy
      - name: Deploy zip on orphan branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: arxiv_build
          force_orphan: true
